[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ambulance-smdp-sim"
version = "0.1.0"
description = "A small, reproducible event-driven ambulance SMDP simulator"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ambulance-smdp = "ambulance_sim.__main__:main"

[tool.setuptools.packages.find]
include = ["ambulance_sim*"]
